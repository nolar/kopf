# The thorough tests run only on the main branch after everything is merged,
# and regularly by time —- on order to detect bugs and incompatibility with
# the new versions of freshly released software (e.g. K8s, K3s, Python libs).
# The first part fully includes the CI workflow, with more versions of K3d/K3s.
# The second part is unique to the thorough tests.
name: Thorough tests
on:
  push:
    branches:
      - main
      - release/**
  schedule:
    - cron: "13 3 * * 6"
  workflow_dispatch: {}

jobs:
  linters:
    name: Linting and static analysis
    runs-on: ubuntu-26.04
    timeout-minutes: 7  # usually 5 mins with coverage
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          github-token: ${{ github.token }}
          enable-cache: true
          python-version: "3.15"
          activate-environment: true
      - run: uv sync --no-dev --group lint
      - run: pre-commit run --all-files
      - run: mypy
      - run: |
          # Separately, because the shared module name "example.py" causes naming conflicts.
          exit_codes=0
          for d in $(find examples -maxdepth 1 -mindepth 1 -type d)
          do
            echo "Checking ${d}"
            mypy $d
            exit_codes=$[${exit_codes} + $?]
          done
          exit ${exit_codes}

  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        install-extras: [ "", "full-auth" ]
        python-version: [ "3.11", "3.12", "3.13", "3.14", "3.15" ]
        include:
          # Assumption: if these special setups work in one version, they work in all versions.
          - install-extras: "uvloop"
            python-version: "3.15"
          - python-version: "3.15t"
    name: Python ${{ matrix.python-version }}${{ matrix.install-extras && ' ' || '' }}${{ matrix.install-extras }}
    runs-on: ubuntu-26.04
    timeout-minutes: 7  # usually 5 mins with coverage
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          github-token: ${{ github.token }}
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          activate-environment: true

      - run: uv sync --no-dev --group test
      - run: uv sync --no-dev --group test --extra ${{ matrix.install-extras }}
        if: ${{ matrix.install-extras }}
      - run: coverage run --branch --source=kopf -m pytest --color=yes --timeout=2

      - name: Publish coverage to Coveralls.io
        uses: coverallsapp/github-action@v2
        with:
          parallel: true
          flag-name: ${{ matrix.python-version }}${{ matrix.install-extras && ' ' || '' }}${{ matrix.install-extras }}
        if: success()
        continue-on-error: true  # tends to fail with no code changes (e.g. only CI/docs)
      - name: Publish coverage to CodeCov.io
        uses: codecov/codecov-action@v7
        env:
          PYTHON: ${{ matrix.python-version }}
        with:
          flags: unit
          env_vars: PYTHON
          token: ${{ secrets.CODECOV_TOKEN }}
        if: success()

  # Only the core functionality is tested: no e2e or functional tests (for simplicity).
  # No coverage: PyPy performs extremely poorly with tracing/coverage (13 mins vs. 3 mins).
  # Extra time: 2-3 mins for building the dependencies (since no binary wheels are available).
  # Extra time: PyPy is good with JIT for repetitive code; tests are too unique for JIT.
  pypy-tests:
    strategy:
      fail-fast: false
      matrix:
        # NB: pypy v7.3.23 fails on catching AttributeError in resolve_obj(); 7.3.22 works.
        # Check the latest versions at https://downloads.python.org/pypy/ and upgrade later.
        install-extras: [ "", "full-auth" ]
        python-version: [ "pypy-3.11", "pypy-3.12" ]
    name: Python ${{ matrix.python-version }}${{ matrix.install-extras && ' ' || '' }}${{ matrix.install-extras }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          github-token: ${{ github.token }}
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          activate-environment: true

      - run: sudo apt-get update && sudo apt-get install libxml2-dev libxslt-dev

      - run: uv sync --no-dev --group test
      - run: uv sync --no-dev --group test --extra ${{ matrix.install-extras }}
        if: ${{ matrix.install-extras }}
      - run: pytest --color=yes --timeout=2 --no-cov

  functional:
    strategy:
      fail-fast: false
      matrix:
        k3s: [latest, v1.37, v1.36, v1.35]
    name: K3s ${{matrix.k3s}}
    runs-on: ubuntu-26.04
    timeout-minutes: 10  # usually 4-5 mins
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          github-token: ${{ github.token }}
          enable-cache: true
          python-version: "3.15"
          activate-environment: true
      - uses: nolar/setup-k3d-k3s@v1
        with:
          version: ${{ matrix.k3s }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          k3s-args: --disable=metrics-server@server:*

      - run: uv sync --no-dev --group test
      - run: uv pip install -r examples/requirements.txt
      - run: pytest --color=yes --timeout=30 --only-e2e

  full-scale:
    strategy:
      fail-fast: false
      matrix:
        k8s: [latest, v1.37.1, v1.36.5, v1.35.9]
    name: K8s ${{matrix.k8s}}
    runs-on: ubuntu-26.04
    timeout-minutes: 10  # usually 4-5 mins
    env:
      K8S: ${{ matrix.k8s }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          github-token: ${{ github.token }}
          enable-cache: true
          python-version: "3.15"
          activate-environment: true
      - run: tools/install-minikube.sh

      - run: uv sync --no-dev --group test
      - run: uv pip install -r examples/requirements.txt
      - run: pytest --color=yes --timeout=30 --only-e2e

  coveralls-finish:
    name: Finalize coveralls.io
    needs: [unit-tests, pypy-tests, functional]
    runs-on: ubuntu-26.04
    steps:
      - name: Finish coverage at Coveralls.io
        uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true
